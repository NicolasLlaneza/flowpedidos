services:
  postgres:
    image: postgres:16-alpine
    container_name: tfi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d:ro
    ports:
      # Puerto del host configurable para evitar choque con un PostgreSQL local.
      # Internamente sigue siendo 5432 (n8n se conecta por la red interna).
      - "${PG_HOST_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tfi-net

  n8n:
    image: n8nio/n8n:latest
    container_name: tfi-n8n
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Encriptación de credenciales guardadas en n8n
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}

      # Persistencia de n8n en postgres (no en SQLite del container)
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB}
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}

      # Config básica
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      WEBHOOK_URL: http://localhost:5678/
      GENERIC_TIMEZONE: America/Argentina/Mendoza
      TZ: America/Argentina/Mendoza

      # Seguridad: requiere usuario/clave para acceder
      N8N_USER_MANAGEMENT_DISABLED: "false"

      # Suprime warning de permisos de la versión nueva
      N8N_RUNNERS_ENABLED: "true"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"

      # Permitir módulos nativos de Node en los Code nodes (crypto para SHA-256
      # de seudonimización y hashes de email/teléfono)
      NODE_FUNCTION_ALLOW_BUILTIN: "crypto"

      # Permitir lectura de variables de entorno desde los nodos (necesario
      # para que el HTTP Request de WhatsApp use $env.WHATSAPP_PHONE_NUMBER_ID
      # en la URL y $env.WHATSAPP_ACCESS_TOKEN en el header de auth).
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"

      # Meta WhatsApp Business API — disponibles como $env.WHATSAPP_* en los Code nodes
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n-workflows:/workflows
    ports:
      - "5678:5678"
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:5678/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - tfi-net

  mock-marketplace:
    image: nginx:alpine
    container_name: tfi-mock-marketplace
    restart: unless-stopped
    volumes:
      - ./mocks/data:/usr/share/nginx/html:ro
      - ./mocks/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "3001:80"
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - tfi-net

  # WooCommerce de prueba (WordPress + MySQL) para integración multicanal real.
  # WP y n8n viven en la misma red interna → el webhook viaja sin pasar por
  # internet, sin necesidad de ngrok.
  mysql:
    image: mysql:8.0
    container_name: tfi-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: wordpress
      MYSQL_USER: ${WP_DB_USER}
      MYSQL_PASSWORD: ${WP_DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - tfi-net

  wordpress:
    image: wordpress:latest
    container_name: tfi-wordpress
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: mysql
      WORDPRESS_DB_USER: ${WP_DB_USER}
      WORDPRESS_DB_PASSWORD: ${WP_DB_PASSWORD}
      WORDPRESS_DB_NAME: wordpress
    volumes:
      - wp_data:/var/www/html
    ports:
      - "${WP_HOST_PORT:-8080}:80"
    networks:
      - tfi-net

volumes:
  postgres_data:
    name: tfi_postgres_data
  n8n_data:
    name: tfi_n8n_data
  mysql_data:
    name: tfi_mysql_data
  wp_data:
    name: tfi_wp_data

networks:
  tfi-net:
    name: tfi-net
    driver: bridge
