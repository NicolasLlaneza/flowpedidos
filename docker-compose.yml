services:
  postgres:
    image: postgres:16-alpine
    container_name: tfi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tfi-net

  n8n:
    image: n8nio/n8n:latest
    container_name: tfi-n8n
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Encriptación de credenciales guardadas en n8n
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}

      # Persistencia de n8n en postgres (no en SQLite del container)
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB}
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}

      # Config básica
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      WEBHOOK_URL: http://localhost:5678/
      GENERIC_TIMEZONE: America/Argentina/Mendoza
      TZ: America/Argentina/Mendoza

      # Seguridad: requiere usuario/clave para acceder
      N8N_USER_MANAGEMENT_DISABLED: "false"

      # Suprime warning de permisos de la versión nueva
      N8N_RUNNERS_ENABLED: "true"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n-workflows:/workflows
    ports:
      - "5678:5678"
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:5678/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - tfi-net

volumes:
  postgres_data:
    name: tfi_postgres_data
  n8n_data:
    name: tfi_n8n_data

networks:
  tfi-net:
    name: tfi-net
    driver: bridge
