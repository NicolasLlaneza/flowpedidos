# Mock de marketplace (estilo Mercado Libre)
# Sirve archivos JSON estáticos como si fuera una API REST.
# Acepta GET /orders/123 y devuelve /orders/123.json con content-type correcto.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;

    # CORS amplio (n8n y cualquier cliente local)
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;

    default_type application/json;

    # Health check
    location = /healthz {
        return 200 '{"status":"ok","service":"mock-marketplace"}';
    }

    # Para cualquier otra ruta: probar el archivo, después con .json, después 404
    location / {
        try_files $uri $uri.json =404;
    }
}
